# StaXX — publish the user guide as a website.
#
# The guide is written as plain markdown in docs/guide/ so it stays readable in
# a text editor and on GitHub. This workflow is the only thing that turns it into
# a website: nothing in docs/ is written for a site generator, and nothing here
# writes back into docs/ — every step below works in a scratch folder, so a
# person reading the repository sees exactly what was written.
#
# main's guide is the top level, exactly as always — what somebody reads
# before deciding whether to install StaXX, so it must never move or change
# shape because of this. dev's guide is also published, into a dev/ subfolder,
# so Adrian can read unreleased documentation rendered rather than as raw
# markdown on GitHub — he has accepted that this makes it publicly reachable,
# just unlinked from the main site. GitHub Pages serves only one site per
# repository, so both branches build into the same site rather than two.
#
# docs/ also holds the project's internal thinking — the feasibility study, the
# idea lists, the schema reference and the developer overview. None of that is
# written for a user. So the staging step names the guide and the glossary and
# copies only those, rather than copying docs/ and excluding the rest: an
# exclusion list quietly stops covering everything the day somebody adds a file.
#
# ONE MANUAL STEP, once, before any of this publishes anything: in the
# repository's Settings -> Pages, the source has to be set to "GitHub Actions".
# Until that is done every run here goes green and nothing appears on the web.
#
# Copyright 2026, StaXX contributors. GPL-2.0.

name: Publish the guide

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages
  # Deliberately not cancel-in-progress. A deploy interrupted halfway can leave
  # the live site part old and part new; letting a superseded run finish costs a
  # couple of minutes and the next push overwrites it anyway.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Where the site is assembled. Not the repository, and not _site — that
      # name belongs to Jekyll's output.
      SITE: _site-src

    steps:
      # Two explicit checkouts, regardless of which branch triggered the run —
      # main always builds the top level and dev always builds dev/, so a push
      # to dev can never alter what the main pages say, and a push to main
      # always refreshes both (dev's guide can otherwise drift out of date
      # silently, since nothing else would rebuild it).
      - uses: actions/checkout@v5
        with:
          ref: main
          path: main-src

      - uses: actions/checkout@v5
        with:
          ref: dev
          path: dev-src

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Stage the guide
        run: |
          mkdir -p "$SITE"

          # One copy of the staging logic, called once per branch, so the two
          # copies can never drift apart. Takes the checkout to read from and
          # the folder to write into ($SITE for main, $SITE/dev for dev).
          stage_guide() {
            local src="$1" dest="$2"
            mkdir -p "$dest"

            # Named sources only — see the note at the top about what else is
            # in docs/. Every guide page, then the glossary beside them.
            cp "$src"/docs/guide/*.md "$dest/"
            cp "$src"/docs/glossary.md "$dest/"

            # A site needs a front page, and the guide's index is called
            # README because that is what GitHub shows when somebody opens
            # the folder.
            mv "$dest/README.md" "$dest/index.md"

            # Screenshots. docs/images/guide/ does not exist yet — the guide
            # is all words so far — so this has to be a no-op rather than a
            # failure. The folder keeps the shape it has in the repository,
            # images/guide/, so a page written as ../images/guide/foo.png is
            # correct when read on GitHub, where the page sits one level down
            # inside docs/guide/.
            if [ -d "$src/docs/images/guide" ]; then
              mkdir -p "$dest/images"
              cp -a "$src/docs/images/guide" "$dest/images/"
            fi

            # Two link fixes, both for the same reason: on the site every
            # page sits at the top level of its own section (site root for
            # main, dev/ for dev), so a ../ that is correct in the repository
            # climbs out of that section here. This is a project site served
            # under /Staxx/, so ../ from dev/ does not stop at the site root
            # — it climbs past it and the link is simply gone. The plugin
            # that repairs .md links between pages cannot help either: it
            # only sees paths that stay inside the site.
            #
            # The glossary link is the one every guide page closes with, and
            # the only link in the guide reaching outside its own folder
            # today. The image rewrite does nothing at all yet and is here so
            # it is already right the day the first screenshot lands.
            sed -i -e 's#\.\./glossary\.md#glossary.md#g' \
                   -e 's#\.\./images/guide/#images/guide/#g' "$dest"/*.md
          }

          stage_guide main-src "$SITE"
          stage_guide dev-src "$SITE/dev"

          # The dev section's warning banner is generated here, at build time,
          # never committed to a repo file. A banner written into docs/ on dev
          # gets carried into main by the next merge and then has to be
          # remembered and removed, which has repeatedly gone wrong on this
          # project — generating it only in this scratch folder means there is
          # nothing to carry.
          {
            echo "> **This describes the development branch.** It covers"
            echo "> features that may not be in the stable release yet, and"
            echo "> may change or disappear before release. For the stable"
            echo "> guide, see [the main site](..)."
            echo
            cat "$SITE/dev/index.md"
          } > "$SITE/dev/index.md.new"
          mv "$SITE/dev/index.md.new" "$SITE/dev/index.md"

          # The site's own settings, kept outside docs/ so that folder stays
          # plain markdown. Site-wide, not per-branch, so taken from main only
          # and staged once at the root — a dev/ subfolder inherits it from
          # the site, it does not need its own copy.
          cp main-src/.github/pages/_config.yml "$SITE/"

          # The site's own stylesheet, kept beside the config for the same
          # reason. It layers dark-mode rules over the theme rather than
          # replacing it, and Jekyll only treats it as a stylesheet at this
          # exact path.
          mkdir -p "$SITE/assets/css"
          cp main-src/.github/pages/style.scss "$SITE/assets/css/style.scss"

          # Belt and braces on the promise above: if an internal document ever
          # reaches the staging folder — main's or dev's half — fail loudly
          # here rather than publish it.
          for section in "$SITE" "$SITE/dev"; do
            for internal in README feasibility feature-ideas settings-ideas x-unraid-schema; do
              if [ -e "$section/${internal}.md" ]; then
                echo "Internal document ${internal}.md reached the site folder — refusing to publish." >&2
                exit 1
              fi
            done
          done

          # A half-built site deploying is worse than a run failing: the
          # deploy replaces the live site wholesale, so check both front pages
          # exist and actually have content before going any further.
          for index in "$SITE/index.md" "$SITE/dev/index.md"; do
            if [ ! -s "$index" ]; then
              echo "$index is missing or empty — refusing to publish." >&2
              exit 1
            fi
          done

      - name: Point the site at the address Pages will serve it from
        run: |
          # The theme builds its stylesheet link from these, so a project site
          # left without them renders unstyled. Taken from the Pages settings
          # rather than written into the config by hand, so renaming the
          # repository cannot silently break every page on the site.
          {
            echo "url: ${{ steps.pages.outputs.origin }}"
            echo "baseurl: ${{ steps.pages.outputs.base_path }}"
          } >> "$SITE/_config.yml"

      - name: Build
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_site-src
          destination: ./_site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    # The environment is what gives this job the right to publish, and what puts
    # the site's address on the run's summary page.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
