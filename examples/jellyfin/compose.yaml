# Worked example of the x-unraid schema — see docs/x-unraid-schema.md.
#
# This is an ordinary compose file. Everything under x-unraid is ignored by
# Compose, so `docker compose up` runs it unchanged on any machine, with or
# without StaXX. Delete every x-unraid block and it still works — you
# just get a plainer form, with the names worked out from the file.
#
# Note where the two kinds of information sit. x-unraid describes the stack and
# the container: what it is called, its logo (given per container — a stack's
# own picture is just its containers' logos, tiled together), what it is for.
# What each individual setting is for is written in the comment beside that
# setting, which is where a person would have written it anyway. Two markers
# ride at the END of a comment, after the prose:
#
#   -!S   this value is a secret — hidden when Sanitise is on
#   -!R   this value must not be left empty

x-unraid:
  version: 1
  category: MediaApp:Video
  project: https://jellyfin.org
  support: https://forum.jellyfin.org
  overview: |
    The Free Software Media System. Streams your own media library to any
    device, with no tracking and no subscription.

services:
  jellyfin:
    image: jellyfin/jellyfin:10.10.3
    container_name: jellyfin
    restart: unless-stopped
    ports:
      - "8096:8096"                             # the web interface -!R
      - "7359:7359/udp"                         # lets Jellyfin apps find this server on their own
    volumes:
      - /mnt/user/appdata/jellyfin/config:/config   # database, settings and metadata. Back this up -!R
      - /mnt/user/appdata/jellyfin/cache:/cache     # transcode scratch space. Losing it costs nothing
      - /mnt/user/media:/media:ro                   # your films and shows, mounted read-only -!R
    devices:
      - /dev/dri:/dev/dri                       # Intel QuickSync or AMD VAAPI. Remove if there is no GPU
    environment:
      PUID: "99"                                # -!R
      PGID: "100"                               # -!R
      TZ: "America/Toronto"                     # affects scheduled tasks and on-screen times
      JELLYFIN_PublishedServerUrl: ""           # external address, if you reach this through a reverse proxy

    x-unraid:
      icon: https://raw.githubusercontent.com/jellyfin/jellyfin-ux/master/branding/SVG/icon-transparent.svg
      webui: "http://[IP]:[PORT:8096]/"
      overview: |
        On first run, open the web interface to complete setup. Point the
        library at `/media`.
