# t155-web — the front of the walkthrough site. nginx serves, PHP-FPM renders.
x-unraid:
  version: 1
  overview: Walkthrough fixture (PLAN_156). Reads MariaDB and Redis through published ports.
  category: Tools:Utilities

x-logging: &logging
  driver: json-file
  options:
    max-size: "1m"

services:
  web:
    image: nginx:1.27-alpine
    ports:
      - "18080:80"
      - "18443:443"
    volumes:
      - ./conf/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - /mnt/user/appdata/staxx-testing/shared/dhparam.pem:/etc/nginx/dhparam.pem:ro
      - ./site:/var/www/html:ro
    depends_on:
      - php
    logging: *logging
    x-unraid:
      icon: ./.staxx/icon.png
      webui: "http://[IP]:18080/"

  php:
    build: ./php
    volumes:
      - ./site:/var/www/html:ro
      - ./data:/var/www/data
      - data:/var/www/uploads
    environment:
      # The database is another stack, reached through the port it publishes on the server.
      - DB_HOST=${DB_HOST}
      # 13306 on the server; the database itself listens on 3306.
      - DB_PORT=${DB_PORT}
      - DB_NAME=t155
      - DB_USER=t155
      # Redis is another stack too, same arrangement.
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - TZ=${TZ}
    secrets:
      - db_password
    logging: *logging

volumes:
  data:

secrets:
  db_password:
    file: ./secrets/db_password.txt
