server {
    listen 80;
    listen 443 ssl;
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    # dhparam.pem is a stand-in file mapped in from appdata, outside every stack folder.
    # It is deliberately NOT named in an ssl_dhparam line, so a bad mount breaks the mount, not TLS.
    root /var/www/html;
    index index.php;
    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
