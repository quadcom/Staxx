x-unraid:
  version: 1
  imported:
    from: community-applications
    on: 2026-09-24
    id: "https://raw.githubusercontent.com/tubearchivist/unraid-templates/main/TubeArchivist-ES.xml"
    name: "TubeArchivist-ES"
  category: Tools:Utilities
  project: https://github.com/elastic/elasticsearch
  support: https://forums.unraid.net/topic/114073-support-crocs-tube-archivist/
  author: TubeArchivist's Official Repository
  overview: |
    This is a dependancy container for the application "TubeArchivist"

services:
  tubearchivist-es:
    image: bbilly1/tubearchivist-es:latest
    container_name: TubeArchivist-ES
    restart: unless-stopped
    networks:
      - default
    ports:
      - "9200:9200"
    volumes:
      - /mnt/user/appdata/TubeArchivist/es:/usr/share/elasticsearch/data
    environment:
      ELASTIC_PASSWORD: "verysecret"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      discovery.type: "single-node"
      xpack.security.enabled: "true"
      path.repo: "/usr/share/elasticsearch/data/snapshot"
    x-unraid:
      icon: https://i.imgur.com/ftggG6O.jpg
      project: https://github.com/elastic/elasticsearch
      support: https://forums.unraid.net/topic/114073-support-crocs-tube-archivist/
