x-unraid:
  version: 1
  imported:
    from: community-applications
    on: 2026-09-24
    name: "TubeArchivist"
  category: MediaApp:Video
  overview: |
    Your self hosted YouTube media server, full text search, and video download tool.

services:
  tubearchivist:
    image: bbilly1/tubearchivist:latest
    container_name: Demo-TubeArchivist
    restart: unless-stopped
    networks:
      - default
    ports:
      - "17800:8000"
    volumes:
      - /mnt/user/appdata/Demo-TubeArchivist/youtube:/youtube
      - /mnt/user/appdata/Demo-TubeArchivist/cache:/cache
    environment:
      # HOST -!S
      TA_HOST: __BOX_IP__
      TA_USERNAME: tubearchivist
      # TA Password -!R -!S
      TA_PASSWORD: t178-test-only
      # Redis -!S
      REDIS_CON: redis://__BOX_IP__:17637
      # ElasticSearch Password -!R -!S
      ELASTIC_PASSWORD: t178-test-only
      # ElasticSearch -!S
      ES_URL: http://__BOX_IP__:17920
      TZ: America/Toronto
      HOST_UID: "99"
      HOST_GID: "100"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 2m
      timeout: 10s
      retries: 3
      start_period: 30s
    x-unraid:
      icon: https://i.imgur.com/6n4ljjQ.png
      webui: http://[IP]:17800/
