# Stack Manager defaults.
#
# Copied to /boot/config/plugins/stack.manager/stack.manager.cfg on first install.
# Values here are read directly by .page Cond expressions, so keep them simple
# key="value" pairs — no sections, no interpolation.

# Where the Stack Manager UI appears.
#   false = a tab under the existing Docker menu (default, additive, nothing replaced)
#   true  = its own button in the top navigation bar
HEADER_MENU="false"

# Replace the stock Docker tab entirely, rather than adding to it.
# Off by default. Enabling this installs shadow page files; disabling removes them.
# No stock Unraid file is ever modified either way.
TAKEOVER_DOCKER_TAB="false"

# Root directory holding stack definitions. Each stack is a subdirectory
# containing an ordinary compose file.
STACK_ROOT="/boot/config/plugins/stack.manager/stacks"
