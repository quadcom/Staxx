; StaXX defaults.
;
; Copied to /boot/config/plugins/staxx/staxx.cfg on first
; install. Two of these keys (HEADER_MENU, TAKEOVER_DOCKER_TAB) are also
; projected onto separate marker files by apply_settings, which is what .page
; Cond expressions actually read — never this file directly, since parsing an
; ini file on every page render would be wasteful and fragile. Keep entries
; here simple key=value pairs, with the value in double quotes. No sections,
; no interpolation.
;
; COMMENTS MUST START WITH A SEMICOLON, NOT A HASH.
;
; PHP stopped treating # as a comment character in ini files years ago, so a
; hash line is parsed as ordinary content. A comment plain enough to look like
; a bare key survives; one containing brackets, an em dash or the word "no"
; does not, and a single syntax error makes parse_ini_file() reject the WHOLE
; file and return false.
;
; It then fails silently. staxx_cfg() falls back to the user's own config,
; which looks completely normal, because that config already holds every key
; the plugin shipped with. The damage only shows up the day a NEW key is added
; here: existing installations cannot see it, and the default never applies.
; This file had been unreadable since it was written, and adding ICON_FETCH is
; what finally made it visible.

; Where the StaXX UI appears.
;   false = a tab under the existing Docker menu; default, additive, nothing
;           is replaced
;   true  = its own button in the top navigation bar
HEADER_MENU="false"

; Remove the Docker button from the top navigation entirely, replacing it
; with Stacks. Off by default. Enabling this installs shadow page files;
; disabling removes them. No stock Unraid file is ever modified either way.
TAKEOVER_DOCKER_TAB="false"

; Catch installs arriving through Unraid's own Apps page (Community
; Applications) or Add Container pressed by hand, and bring them into StaXX
; as a stack instead of an Unraid container. Opening an existing container
; for editing is only ever offered, never taken automatically — this key
; does not govern that.
;
; Three values, not the usual two:
;   true   = caught silently, as always. The caught-install banner's own
;            "Let Unraid install this instead" link is the way out.
;   prompt = every caught install asks first, on the same offer page the
;            existing-container case already uses.
;   false  = Unraid's own install route, untouched.
; true/false are kept rather than renamed to on/off, because both are
; already written into every config this has ever shipped to and a rename
; would need an alias table just to keep reading old files. prompt is simply
; added beside them — a three-way choice spelled true/prompt/false looks
; like an oversight only if you don't know that.
CATCH_INSTALLS="true"

; Root directory holding stack definitions. Each stack is a subdirectory
; containing an ordinary compose file.
STACK_ROOT="/boot/config/plugins/staxx/stacks"

; Has the person settled where stacks live? Three values, because two cannot
; say what is needed — set once, automatically, the same shape as
; SHELL_WARNED above, never something to edit by hand.
;   ask      = never asked yet; the page may offer to move stacks off flash
;   chosen   = they picked a location, or deliberately kept the one they have
;   declined = they were asked and said not now — remembered, so the page
;              stops asking and only offers the move again from Settings
STORAGE_CHOICE="ask"

; Where a removed stack's folder is kept, zipped. Blank means a "staxx/archives"
; folder under wherever Unraid says appdata lives. Removing a stack never
; deletes it: the whole folder is zipped here and only then taken out of the
; stacks tree.
ARCHIVE_ROOT=""

; Download container icons from the selfh.st icon collection.
;   true  = fetch an icon the first time a container is seen, then cache it
;   false = never reach out; icons already cached are still used
; The only thing sent out is the name of the icon being asked for.
ICON_FETCH="true"

; Record a matched icon in the compose file itself, and copy the picture into
; the stack's own folder, so the logo travels with the file instead of living
; only in the shared cache. Runs quietly in the background, a few services at
; a time; an icon named by hand in a compose file is never touched.
;   true  = record it
;   false = keep guessing on every render, as before; nothing is written
ICON_ADOPT="true"

; Read an image's own documentation when Add is pressed on a Docker Hub or
; local image, and use it to build a fuller starting file.
;   true  = read it, once, only when something is added
;   false = the four-line starting file only; nothing leaves the server
; The only thing sent out is the name of the image being added.
IMAGE_LOOKUP="true"

; A real shell inside a running container, on the Manage tab. Root, no
; command allowlist — anything typed there runs, and anything changed inside
; the container is gone on its next rebuild. On by default; turn it off here
; to remove the option everywhere, including a request built by hand.
SHELL_ENABLED="true"

; Has the "this is a real shell and changes vanish on rebuild" warning been
; shown yet? Set once, automatically, the first time a shell is opened — not
; something to edit by hand.
SHELL_WARNED="false"

; Docker Hub sign-in, used when checking images for updates. An unsigned-in
; server is allowed about a hundred Docker Hub questions an hour (measured);
; signing in raises that ceiling further. HUB_TOKEN holds a Docker Hub access
; token, not a password. Both blank means signed out.
HUB_USER=""
HUB_TOKEN=""

; When to check images for available updates, and what time of day to do it
; at (24-hour clock). "off" never checks on its own.
UPDATE_CHECK="daily"
UPDATE_CHECK_TIME="04:00"

; Alongside checking for updates, look at whether the image's own publisher
; has a GitHub repository with a compose file or a documented example, so a
; setting they added (or dropped) that you do not have can be pointed out
; later. Only ever looked at during the same check pass above — never on its
; own schedule, never for an image pinned to an exact version.
;   true  = look, when a check pass is due anyway
;   false = never reach out to GitHub at all
; The only things sent out are the project's own web address and the path to
; one file inside it — nothing about this server.
WATCH_EXAMPLES="true"

; What happens once an update is found, and how long to wait first.
;   off    = never apply on its own; the pill still shows what was found
;   notify = show it and say so, but never apply it automatically
;   auto   = apply it once the delay has passed
; A stack or service can override this in its own compose file; this is only
; the default for ones that do not.
UPDATE_MODE="notify"
UPDATE_DELAY_HOURS="24"

; Only apply automatic updates inside a daily quiet window, so a container
; never restarts itself while someone is using it.
UPDATE_WINDOW="true"
UPDATE_WINDOW_START="03:00"
UPDATE_WINDOW_END="05:00"

; Send a message through Unraid's own notification system.
;   off     = never
;   found   = once per check pass that finds something
;   applied = that, plus once per finished update run
UPDATE_NOTIFY="off"

; How many previous versions of an image to keep, so a bad update can be
; rolled back. 0 keeps none.
UPDATE_RETAIN="2"

; Remove images that updating has left behind.
;   off    = never; images pile up until removed by hand
;   weekly = once a week, and only an image that is both unused by any
;            container and no longer in any stack's kept history
UPDATE_CLEANUP="off"

; The password/passphrase generator's own choices, set from its panel in the
; stack editor rather than from this settings page. A preference that
; follows the person to any browser, not a secret — nothing generated here
; is ever written to this file.
PWGEN_MODE="chars"
PWGEN_LENGTH="20"
PWGEN_UPPER="true"
PWGEN_DIGITS="true"
PWGEN_PUNCT="true"
PWGEN_WORDS="5"
PWGEN_SEP="-"

; How the StaXXCrypt hashing container lives between hashes.
;   ondemand = not running until a hash is needed, then started, used and
;              stopped again — a second or two, unnoticeable for something
;              used rarely; the default
;   always   = left running, so a hash is near-instant — suits setting up
;              several logins at once
CRYPT_MODE="ondemand"
